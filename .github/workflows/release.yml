name: release
on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv pip install --system hatch
      - run: hatch build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
