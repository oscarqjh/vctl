global
    log /dev/log local0
    stats socket /tmp/vctl-haproxy.sock mode 660 level admin
    stats timeout 30s
defaults
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
frontend http-in
    bind *:8080
    default_backend pool
backend pool
    balance leastconn
    option httpchk GET /health
    server b_10_0_0_5_8000 10.0.0.5:8000 check inter 5s fall 3 rise 2 maxconn 256 slowstart 30s
    server b_10_0_0_6_8000 10.0.0.6:8000 check inter 5s fall 3 rise 2 maxconn 256 slowstart 30s
    server b_10_0_0_7_8000 10.0.0.7:8000 check inter 5s fall 3 rise 2 maxconn 256 slowstart 30s
frontend stats
    bind *:9000
    stats enable
    stats uri /
frontend admin
    bind *:9001
    mode tcp
    default_backend admin_backend
backend admin_backend
    mode tcp
    server admin /tmp/vctl-haproxy.sock
