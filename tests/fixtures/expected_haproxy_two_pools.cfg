global
    log stdout format raw local0
    stats socket /tmp/vctl-haproxy.sock mode 660 level admin expose-fd listeners
    stats socket ipv4@0.0.0.0:9001 level admin
    stats timeout 30s
defaults
    mode http
    option httplog
    option dontlognull
    retries 3
    option redispatch
    timeout connect 5s
    timeout client 1h
    timeout server 1h
frontend pool_a
    bind *:8080
    default_backend pool_a
backend pool_a
    balance leastconn
    option httpchk GET /health
    server b_10_0_0_5_8000 10.0.0.5:8000 check inter 5s fall 3 rise 2 maxconn 256 slowstart 30s on-marked-down shutdown-sessions
    server b_10_0_0_6_8000 10.0.0.6:8000 check inter 5s fall 3 rise 2 maxconn 256 slowstart 30s on-marked-down shutdown-sessions
frontend pool_b
    bind *:8081
    default_backend pool_b
backend pool_b
    balance leastconn
    option httpchk GET /health
    server b_10_0_0_7_8000 10.0.0.7:8000 check inter 5s fall 3 rise 2 maxconn 256 slowstart 30s on-marked-down shutdown-sessions
listen stats
    bind *:9000
    stats enable
    stats uri /
    stats show-legends
