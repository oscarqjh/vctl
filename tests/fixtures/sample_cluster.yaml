apiVersion: vctl/v1
kind: Cluster
cluster:
  venv: /opt/venv
  state_dir: /tmp/vctl-state
  env: {}
profile: qwen3-9b
lb:
  kind: haproxy
  host: 10.0.0.1
  client: { bind_port: 8080 }
  admin:  { bind_port: 9001 }
  stats:  { bind_port: 9000 }
  algorithm: leastconn
  health:   { path: /health, check_interval: 5s, fall: 3, rise: 2 }
  defaults: { maxconn_per_backend: 256, slowstart: 30s, timeout_connect: 5s, timeout_client: 1h, timeout_server: 1h }
